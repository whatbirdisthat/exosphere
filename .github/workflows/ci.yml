name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ── Correctness: typecheck, build, 100%-coverage test gate, and the real CLI over the corpus ──
  test:
    name: test · node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22'] # the npx audience runs everywhere — prove it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit + integration + 100% coverage floor
        run: npm run test:cov
      - name: Story / corpus gate (real CLI over the malicious + benign corpus)
        run: npx vitest run tests/story

  # ── The wall: the agentic threat-stack layer must never erode the pure auditor's trust pillars ──
  wall:
    name: 🧱 wall · pure auditor stays pure while the platform grows around it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Zero runtime dependencies (the auditor of a supply chain has none)
        run: |
          DEPS=$(node -p "JSON.stringify(require('./package.json').dependencies || {})")
          echo "dependencies: $DEPS"
          test "$DEPS" = "{}" || { echo "::error::root package.json must declare zero runtime dependencies"; exit 1; }
      - name: Vendored plugin CLI is in sync with source (deterministic, reproducible)
        run: |
          npm run build:plugin
          git diff --exit-code -- plugins/skillsentry/cli \
            || { echo "::error::plugins/skillsentry/cli is stale — run 'npm run build:plugin' and commit"; exit 1; }
      - name: The auditor plugin is a THIN wrapper (detection stays in the deterministic CLI)
        run: |
          grep -q 'cli/bin.js' plugins/skillsentry/commands/audit.md \
            || { echo "::error::audit.md must invoke the vendored cli/bin.js"; exit 1; }
          echo "✅ auditor plugin is a thin wrapper over the deterministic CLI" >> "$GITHUB_STEP_SUMMARY"

  # ── Dogfooding: the auditor audits itself, in the open, every commit ──
  self-audit:
    name: 🛡️ self-audit · we run our own tool on ourselves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Audit this repo with its own CLI
        run: |
          set +e
          node dist/bin.js . | tee audit.out
          code=$?
          NAME=$(node -p "require('./package.json').name")
          {
            echo "## 🛡️ ${NAME} self-audit"
            echo ""
            echo "_The auditor audits itself — every commit, in the open. Exclusions are disclosed below._"
            echo ""
            echo '```'
            cat audit.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # A non-zero (BLOCK) verdict on our own repo fails CI — we must always pass our own audit.
          exit $code

  # ── Release confidence: the thing we publish to npm actually installs and runs ──
  pack-smoke:
    name: 📦 npm-pack smoke · the published artifact runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack, global-install the tarball, run the published bin
        run: |
          set -e
          npm pack
          npm i -g ./*.tgz
          BIN=$(node -p "Object.keys(require('./package.json').bin)[0]")
          mkdir -p /tmp/clean-skill
          printf '# demo skill\n\nA harmless example skill.\n' > /tmp/clean-skill/SKILL.md
          "$BIN" /tmp/clean-skill
          echo "✅ published bin \`${BIN}\` installs and PASSes a clean skill" >> "$GITHUB_STEP_SUMMARY"
