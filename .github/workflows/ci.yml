name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + integration + coverage (100% line+branch floor)
        run: npm run test:cov
      - name: Build
        run: npm run build
      - name: Story / corpus gate
        run: npx vitest run tests/story
