<b>T0 — Pattern</b><br />per-file, single-line regex + vetted structural matchers<br />e.g. curl | sh · zero-width unicode · over-broad MCP scopes</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-T1-1" data-look="classic" transform="translate(167, 377.75)"><rect class="basic label-container" style="" x="-124" y="-113.25" width="248" height="226.5"/><g class="label" style="" transform="translate(-100, -101.25)"><rect/><foreignObject width="200" height="202.5"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>T1 — Dataflow / taint</b><br />multi-line, in bundled shell scripts<br />tainted SOURCE → propagate across lines → dangerous SINK<br />intra-file (ADR-006) + cross-file via source (ADR-007)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-T3-2" data-look="classic" transform="translate(167, 643)"><rect class="basic label-container" style="" x="-124" y="-102" width="248" height="204"/><g class="label" style="" transform="translate(-100, -90)"><rect/><foreignObject width="200" height="180"><div xmlns="http://www.w3.org/1999/xhtml" style="display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;"><span class="nodeLabel"><p><b>T3 — Temporal / rug-pull</b><br />diff current scan vs an approved .skillsentry.lock<br />NOT a rule — needs two inputs (fresh + baseline)<br />capability-fingerprint diff · additive-only (ADR-008)</p></span></div></foreignObject></g></g><g class="node default" id="my-svg-flowchart-T2-3" data-look="classic" transform="translate(167, 933.25)"><rect class="basic label-container" style="stroke-dasharray:5 5 !important;fill:#f4f4f4 !important" x="-124" y="-90.75" width="248" height="181.5"/><g class="label" style="color:#7a7a7a !important" transform="translate(-100, -78.75)"><rect/><foreignObject width="200" height="157.5"><div style="color: rgb(122, 122, 122) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#7a7a7a !important" class="nodeLabel"><p><b>T2 — Semantic (claims-vs-behaviour)</b><br />would need an LLM → breaks offline + determinism<br /><i>NOT built; reserved as a future OPT-IN tier</i></p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="hsl(0, 0%, 83.3333333333%)" stop-opacity="1"/><stop offset="100%" stop-color="hsl(0, 0%, 88.9215686275%)" stop-opacity="1"/></linearGradient></svg>